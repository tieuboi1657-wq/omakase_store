<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn Đặt Suất Omakase | SABI OMAKASE</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --card-inner: #262626;
      --gold: #d4af37;
      --red-accent: #8b2626;
      --red-hover: #a32e2e;
      --text-gray: #a0a0a0;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Times New Roman', Times, serif, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      padding: 30px 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    
    .page-title {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .cart-grid-layout {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 30px;
    }

    /* KHUNG BÊN TRÁI: DANH SÁCH MÓN & PHẦN GHI CHÚ */
    .cart-section-left { display: flex; flex-direction: column; gap: 20px; }

    .box-card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .box-title {
      color: var(--gold);
      font-size: 16px;
      margin-bottom: 15px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
    }

    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 16px; color: #fff; }
    .cart-item-sub { font-size: 12px; color: var(--text-gray); }

    .cart-item-price {
      font-size: 15px;
      color: var(--gold);
      width: 120px;
      text-align: right;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #e57373;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
    }

    /* GHI CHÚ BẾP */
    .note-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
      color: #ccc;
    }

    .note-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* BÊN PHẢI: CHI TIẾT BUỔI TIỆC & TỔNG TIỀN */
    .cart-section-right { display: flex; flex-direction: column; gap: 20px; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #ddd;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      font-size: 20px;
      color: var(--gold);
      font-weight: bold;
    }

    .btn-checkout {
      background-color: var(--red-accent);
      color: white;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .btn-checkout:hover { background-color: var(--red-hover); }

    select, input[type="text"] {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .cart-grid-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="page-title">Đơn Đặt Suất Omakase Của Quý Khách</h1>

  <div class="cart-grid-layout">
    <!-- CỘT TRÁI: NỘI DUNG GIỎ HÀNG -->
    <div class="cart-section-left">
      <div class="box-card">
        <h3 class="box-title">🥢 Danh mục trải nghiệm đã chọn</h3>
        <div id="cartList">
          <!-- Render tự động qua JavaScript -->
        </div>
      </div>

      <div class="box-card">
        <h3 class="box-title">✍️ Ghi Chú Âm Thực & Khẩu Vị Riêng</h3>
        <div class="note-options">
          <label><input type="checkbox"> Không ăn Wasabi tươi</label>
          <label><input type="checkbox"> Dị ứng hải sản vỏ vỏ (Tôm, Cua)</label>
          <label><input type="checkbox"> Kiêng thịt đỏ / Gan ngỗng</label>
          <label><input type="checkbox"> Tiệc kỷ niệm / Sinh nhật</label>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI: CHI TIẾT LỊCH HẸN & THANH TOÁN -->
    <div class="cart-section-right">
      <div class="box-card">
        <h3 class="box-title">📅 Chi Tiết Buổi Tiệc</h3>
        
        <label style="font-size: 13px; color: var(--text-gray);">CHỌN CHI NHÁNH PHỤC VỤ</label>
        <select id="branchSelect">
          <option>Sabi Omakase • Quận 1 (Phòng Quầy Hinoki)</option>
          <option>Sabi Omakase • Quận 5 (Chợ Lớn)</option>
          <option>Sabi Omakase • Tây Hồ (Hà Nội)</option>
        </select>

        <label style="font-size: 13px; color: var(--text-gray);">PHIÊN TRẢI NGHIỆM TIỆC</label>
        <select id="sessionSelect">
          <option>18:00 - Phiên Hoàng Hôn (Khuyên dùng)</option>
          <option>20:00 - Phiên Dạ Tiệc Ánh Nến</option>
        </select>

        <div style="margin-top: 15px;">
          <div class="summary-row">
            <span>Tạm tính suất ăn:</span>
            <span id="subTotal">0 đ</span>
          </div>
          <div class="summary-row">
            <span>Thuế VAT & Phí phục vụ (10%):</span>
            <span id="taxFee">0 đ</span>
          </div>

          <div class="summary-total">
            <span>Tổng thanh toán:</span>
            <span id="grandTotal">0 đ</span>
          </div>
        </div>

        <button class="btn-checkout" onclick="xacNhanDatBan()">TIẾN HÀNH THANH TOÁN & XÁC NHẬN BÀN</button>
      </div>
    </div>
  </div>
</div>

<script>
  function renderCart() {
    let cart = JSON.parse(localStorage.getItem('sabi_cart')) || [];
    let cartList = document.getElementById('cartList');
    
    if (cart.length === 0) {
      cartList.innerHTML = '<p style="color: var(--text-gray); padding: 20px 0;">Giỏ hàng đặt chỗ hiện đang trống.</p>';
      updateTotal(0);
      return;
    }

    let html = '';
    let total = 0;

    cart.forEach((item, index) => {
      let itemTotal = item.price * item.quantity;
      total += itemTotal;
      html += `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.name}">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-sub">${item.branch} | Số lượng: ${item.quantity} khách</div>
          </div>
          <div class="cart-item-price">${itemTotal.toLocaleString('vi-VN')} đ</div>
          <button class="btn-remove" onclick="xoaMon(${index})">✕</button>
        </div>
      `;
    });

    cartList.innerHTML = html;
    updateTotal(total);
  }

  function updateTotal(subtotal) {
    let tax = subtotal * 0.1;
    let grand = subtotal + tax;

    document.getElementById('subTotal').innerText = subtotal.toLocaleString('vi-VN') + ' đ';
    document.getElementById('taxFee').innerText = tax.toLocaleString('vi-VN') + ' đ';
    document.getElementById('grandTotal').innerText = grand.toLocaleString('vi-VN') + ' đ';
  }

  function xoaMon(index) {
    let cart = JSON.parse(localStorage.getItem('sabi_cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('sabi_cart', JSON.stringify(cart));
    renderCart();
  }

  function xacNhanDatBan() {
    let cart = JSON.parse(localStorage.getItem('sabi_cart')) || [];
    if(cart.length === 0) {
      alert("Vui lòng chọn suất Omakase trước khi đặt bàn!");
      return;
    }
    alert("Xác nhận thông tin thành công! Chuyển qua giao diện Đặt chỗ & Thanh toán cọc.");
  }

  // Tự động tải danh sách món khi mở trang
  document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
